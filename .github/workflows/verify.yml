name: Verify public research station

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Compile structural checks
        run: python -B -m py_compile tools/check_change_history.py tools/check_research_station.py
      - name: Verify bounded history
        run: python -B tools/check_change_history.py
      - name: Verify research station and Creature boundaries
        run: python -B tools/check_research_station.py
